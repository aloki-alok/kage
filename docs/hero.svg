<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 880 280" role="img" aria-labelledby="t d">
  <title id="t">Kage</title>
  <desc id="d">Tag your own Claude Code session from anywhere in Slack.</desc>
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e5462e" stop-opacity=".16"/>
      <stop offset=".55" stop-color="#e5462e" stop-opacity="0"/>
    </linearGradient>
    <style>
      .sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>
  <rect width="880" height="280" rx="16" fill="#0f0e13"/>
  <!-- the shadow: a long diagonal cast from the glyph -->
  <path d="M60 280 L260 0 L520 0 L320 280 Z" fill="url(#fade)"/>
  <text x="62" y="196" class="sans" font-size="168" font-weight="700" fill="#e5462e">影</text>
  <text x="262" y="122" class="sans" font-size="64" font-weight="700" fill="#f4f1ea" letter-spacing="-1">kage</text>
  <text x="264" y="158" class="sans" font-size="20" fill="#a39e94">Tag your own Claude Code from anywhere in Slack.</text>
  <!-- a Slack message, as you'd type it -->
  <g transform="translate(264 188)">
    <rect width="560" height="56" rx="10" fill="#1b1a22" stroke="#2c2a35"/>
    <rect x="14" y="14" width="28" height="28" rx="6" fill="#3a3746"/>
    <text x="56" y="34" class="mono" font-size="16" fill="#f4f1ea"><tspan fill="#e5462e" font-weight="700">@kage</tspan> why did the 3am queue alarm fire?</text>
    <g transform="translate(508 16)">
      <rect width="38" height="24" rx="12" fill="#2a1d1b" stroke="#e5462e" stroke-opacity=".5"/>
      <text x="19" y="17" class="sans" font-size="13" text-anchor="middle">🥷</text>
    </g>
  </g>
</svg>
