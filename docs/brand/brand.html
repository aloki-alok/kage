<!doctype html>
<!-- Source of Kage's logo and README hero (the Cast design language). Regenerate the PNGs with: ./docs/brand/render.sh -->
<meta charset="utf-8">
<title>Kage brand</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Cast: day is light (you are here), night is dark (Kage works alone). Serif is you, mono is Kage. Orange only means "needs you". */
:root { --light: #f2efe9; --shade: #16140f; --mid: #6d675e; --signal: #ff4f00;
  --you: "Instrument Serif", serif; --kage: "JetBrains Mono", ui-monospace, monospace; }
.night { --light: #121110; --shade: #efe9df; --mid: #a19b91; }
* { box-sizing: border-box; margin: 0; }
html, body { background: transparent; }
section { display: none; }
section:target { display: block; }

/* The cast: the same letters, flipped onto the ground and slanted away from the light. */
.cast { position: relative; display: inline-block; line-height: 1; }
.cast .shadow { position: absolute; left: 0; top: 0; white-space: nowrap; color: var(--shade); opacity: .9;
  transform-origin: 0 82%; transform: scaleY(calc(-1 * var(--len))) skewX(calc(-1 * var(--skew)));
  -webkit-mask-image: linear-gradient(to bottom, transparent 5%, #000 90%); }

.hero { width: 1280px; height: 560px; padding: 40px 56px; background: var(--light); color: var(--shade); position: relative; overflow: hidden; }
.hero .word { font: 400 2.4rem var(--you); }
.hero .say { position: absolute; left: 56px; top: 150px; font: 400 9.5rem/1 var(--you); letter-spacing: -0.02em; white-space: nowrap; }
.hero .say::after { content: ""; position: absolute; left: 0; right: -200px; bottom: .19em; height: 1px; background: currentColor; opacity: .25; }
.hero .say i { font-style: italic; }
.hero .work { position: absolute; right: 56px; bottom: 40px; text-align: right; font: 1rem/1.7 var(--kage); }
.hero .work .needs { color: var(--signal); }
.hero .tag { position: absolute; left: 56px; bottom: 40px; font: 600 .78rem var(--kage); letter-spacing: .14em; text-transform: uppercase; color: var(--mid); }
</style>

<!-- App icon, as on the Cast page. 96 units, rendered at 512 px. -->
<section id="icon-light"><svg viewBox="0 0 96 96" width="512" height="512"><rect width="96" height="96" rx="20" fill="#f2efe9"/><text x="26" y="66" font-family="Instrument Serif" font-size="64" fill="#16140f">k</text><text x="26" y="66" font-family="Instrument Serif" font-size="64" fill="#16140f" opacity=".85" transform="translate(0 66) scale(1 -0.42) skewX(-52) translate(0 -66)">k</text></svg></section>
<section id="icon-dark"><svg viewBox="0 0 96 96" width="512" height="512"><rect width="96" height="96" rx="20" fill="#121110"/><text x="26" y="66" font-family="Instrument Serif" font-size="64" fill="#efe9df">k</text><text x="26" y="66" font-family="Instrument Serif" font-size="64" fill="#efe9df" opacity=".5" transform="translate(0 66) scale(1 -0.42) skewX(-52) translate(0 -66)">k</text></svg></section>

<!-- README hero: what you typed, its evening shadow, and the work Kage did in it. -->
<template id="hero">
  <div class="hero">
    <span class="cast word">kage<span class="shadow" style="--len:.55; --skew:52deg">kage</span></span>
    <div class="say"><span class="cast"><i>@kage</i> cover for me<span class="shadow" style="--len:.8; --skew:64deg"><i>@kage</i> cover for me</span></span></div>
    <div class="work">
      <div>set your status: away until 22:00</div>
      <div>6 people asked for you</div>
      <div>answered 5 from what you know</div>
      <div>kept a list of what changed</div>
      <div class="needs">1 needs your yes: a refund over $500</div>
    </div>
    <div class="tag">your shadow, at work</div>
  </div>
</template>
<section id="hero-light"></section>
<section id="hero-dark" class="night"></section>
<script>
for (const id of ['hero-light', 'hero-dark']) document.getElementById(id).append(document.getElementById('hero').content.cloneNode(true));
</script>
