<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-labelledby="t d">
  <title id="t">How Kage works</title>
  <desc id="d">You tag @kage in Slack. The message reaches the Kage hub on your machine over Socket Mode, which checks it came from you and hands it to your own Claude Code session. Claude answers in the same thread.</desc>
  <style>
    /* Cast tokens (docs/brand/brand.html). Orange means "needs you", so the flow is drawn in ink. */
    :root { --bg:#f2efe9; --ink:#16140f; --muted:#6d675e; --line:#d8d2c7; --card:#ebe7df; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#121110; --ink:#efe9df; --muted:#a19b91; --line:#2e2b27; --card:#1a1816; }
    }
    .sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .card { fill: var(--card); stroke: var(--line); }
    .h { fill: var(--ink); font-size: 15px; font-weight: 600; }
    .s { fill: var(--muted); font-size: 13px; }
    .k { fill: var(--ink); font-size: 13px; }
    .step { fill: var(--muted); font-size: 12px; }
    .wire { stroke: var(--ink); stroke-width: 1.5; fill: none; marker-end: url(#tip); }
    .back { stroke: var(--muted); stroke-width: 1.5; fill: none; marker-end: url(#tipm); }
  </style>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="var(--ink)" stroke-width="1.6"/></marker>
    <marker id="tipm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="var(--muted)" stroke-width="1.6"/></marker>
  </defs>
  <rect width="880" height="300" rx="16" fill="var(--bg)"/>

  <!-- Your machine: a quiet bracket over cards 2 and 3 -->
  <path d="M332 52 L332 44 L852 44 L852 52" fill="none" stroke="var(--line)" stroke-width="1.5"/>
  <text x="592" y="34" text-anchor="middle" class="sans s">On your machine</text>

  <!-- 1 You, in Slack -->
  <rect x="28" y="64" width="212" height="132" rx="12" class="card"/>
  <text x="48" y="94" class="sans step">1</text>
  <text x="64" y="94" class="sans h">You, in Slack</text>
  <text x="48" y="128" class="mono k">@kage check this</text>
  <text x="48" y="154" class="sans s">In any thread, channel</text>
  <text x="48" y="174" class="sans s">or DM</text>

  <path d="M246 130 L 326 130" class="wire"/>
  <text x="286" y="118" text-anchor="middle" class="sans step">Socket Mode</text>

  <!-- 2 Kage hub -->
  <rect x="332" y="64" width="232" height="132" rx="12" class="card"/>
  <text x="352" y="94" class="sans step">2</text>
  <text x="368" y="94" class="sans h">Kage hub</text>
  <text x="352" y="128" class="sans s">Checks the message is yours</text>
  <text x="352" y="150" class="sans s">Adds the thread as context</text>
  <text x="352" y="172" class="sans s">No open port</text>

  <path d="M570 130 L 614 130" class="wire"/>

  <!-- 3 Claude Code -->
  <rect x="620" y="64" width="232" height="132" rx="12" class="card"/>
  <text x="640" y="94" class="sans step">3</text>
  <text x="656" y="94" class="sans h">Claude Code</text>
  <text x="640" y="128" class="sans s">Your own session, with</text>
  <text x="640" y="150" class="sans s">your skills, tools and</text>
  <text x="640" y="172" class="sans s">access</text>

  <!-- 4 the answer comes back -->
  <path d="M736 204 L736 244 L134 244 L134 206" class="back"/>
  <text x="440" y="270" text-anchor="middle" class="sans s"><tspan class="step">4</tspan>  The answer, in the same thread</text>
</svg>
