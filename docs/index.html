<style>
:root{--paper:#f2efe9;--panel:#e9e5dd;--ink:#16140f;--ink2:#47423a;--mid:#6d675e;--line:#d8d2c7;--line2:#e3ded5;--you:#ff4f00;--code:#ebe7df;
--serif:"Familjen Grotesk",system-ui,sans-serif;--sans:"JetBrains Mono",ui-monospace,Menlo,monospace;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--h1w:600;--h1s:.86;--ease:cubic-bezier(.19,1,.22,1)}
:root[data-theme="dark"]{--paper:#121110;--panel:#1b1916;--ink:#efe9df;--ink2:#cfc8bc;--mid:#a19b91;--line:#2c2925;--line2:#221f1c;--code:#1f1d1a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#121110;--panel:#1b1916;--ink:#efe9df;--ink2:#cfc8bc;--mid:#a19b91;--line:#2c2925;--line2:#221f1c;--code:#1f1d1a}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:14.5px/1.8 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
.mono{font-family:var(--mono)}
/* header */
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:grid;grid-template-columns:280px 1fr auto;align-items:center;height:60px;padding:0 28px;gap:20px}
.logo{display:flex;align-items:baseline;gap:10px;text-decoration:none}
.logo .w{font:400 30px/1 var(--serif);position:relative}
.logo .t{font:500 11px var(--mono);color:var(--mid);letter-spacing:.06em}
.keys{display:flex;gap:26px;font:500 12px var(--mono);color:var(--mid);letter-spacing:.04em}
.keys a{text-decoration:none}.keys a:hover{color:var(--ink)}
.keys b{font-weight:500;color:var(--mid);opacity:.7;margin-right:6px}
.tools{display:flex;gap:8px}
.btn{font:500 12px var(--mono);background:transparent;border:1px solid var(--line);color:var(--ink);padding:7px 12px;cursor:pointer;letter-spacing:.03em}
.btn:hover{border-color:var(--mid)}
.btn kbd{color:var(--mid);margin-left:10px;font:inherit}
/* layout */
.page{display:grid;grid-template-columns:280px minmax(0,1fr) 240px;gap:0 48px;padding:0 28px;max-width:1440px;margin:0 auto}
nav.side{position:sticky;top:60px;align-self:start;height:calc(100vh - 60px);overflow:auto;padding:32px 0 40px}
.grp{font:500 11px var(--mono);letter-spacing:.08em;color:var(--mid);margin:26px 0 8px;text-transform:uppercase}
.grp:first-child{margin-top:0}
nav.side a{display:grid;grid-template-columns:30px 1fr;padding:6px 10px 6px 0;text-decoration:none;color:var(--ink2);font-size:13px;border-left:1px solid var(--line);padding-left:14px;transition:color .2s var(--ease),border-color .2s var(--ease)}
nav.side a .n{font:500 11px/2 var(--mono);color:var(--mid)}
nav.side a:hover{color:var(--ink)}
nav.side a.on{color:var(--ink);border-left:2px solid var(--ink);padding-left:13px;font-weight:500}

.eyebrow{font:500 12px var(--mono);color:var(--mid);letter-spacing:.06em}

.stand{font-size:16.5px;line-height:1.7;color:var(--ink2);margin:0 0 30px;max-width:620px}

/* pager */
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:64px;max-width:700px}
.pager a{border:1px solid var(--line);padding:16px 18px;text-decoration:none;transition:border-color .25s var(--ease),transform .25s var(--ease)}

.scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 30%,transparent);display:none;z-index:20;padding-top:12vh}

.palette{max-width:620px;margin:0 auto;background:var(--paper);border:1px solid var(--line);box-shadow:0 30px 80px -30px rgba(0,0,0,.4)}

.res .rt{font-weight:500}.res .rs{font-size:13px;color:var(--mid);margin-top:2px}

.res .empty{padding:18px 20px;color:var(--mid);font-size:14px}
.zoom{position:fixed;inset:0;background:var(--paper);z-index:30;display:none;overflow:auto;padding:40px;cursor:zoom-out}
.zoom.open{display:block}.zoom svg{width:100%;height:auto;max-height:none}
.fade{animation:in .5s var(--ease) both}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

<script>
const D={"pages":[{"id":"how-kage-works","title":"How Kage works","group":"Start here","md":"```mermaid\nflowchart TD\n  IN[\"Slack, WhatsApp, email, calls, Chrome, GitHub\"]:::door\n  IN --> CN[\"Connectors turn each message into one task\"]\n  CN --> GT[\"Gate: who sent it, how much trust\"]\n  GT -->|no proof| X[\"Dropped. Nothing runs.\"]\n  GT --> DS[\"Dispatcher: one session per conversation\"]\n  SC[\"Schedules and kagelets\"] --> DS\n  DS --> SE[\"Claude Code session, in a sandbox\"]\n  SE --> TL[\"Kage tools\"]\n  TL -->|risky call| AP[\"Approval card in your DM\"]:::you\n  TL --> OB[\"Outbound guard: no secrets, no crowd pings\"]\n  OB --> BACK[\"Answer in the same thread\"]:::door\n  CF[\"config.json and secrets.json\"]:::key -.->|hub only| CN\n```\n\n# How Kage works\n\nEvery message, from any surface, enters one process on your machine: the hub. The hub decides who sent it and how far they may go, gives each conversation its own Claude Code session, and checks everything that leaves.\n\n## One hub, many doors\n\nSlack, WhatsApp, email, phone calls, your Chrome and GitHub all arrive at the same place. A connector turns each one into the same task shape, so the rest of Kage never cares where a message came from.\n\n## Trust comes from proof\n\nThe gate reads who sent a message and what proves it. Your own typed words get owner trust. A listed teammate gets teammate trust. A message with no proof is dropped before Claude ever reads it. [Who may drive Kage](#who-may-drive-kage) has the full table.\n\n## One session per conversation\n\nEach Slack thread, email thread or call keeps its own Claude Code session, and a restart resumes it. [Slack threads and sessions](#slack-threads-and-sessions) explains the keys.\n\n## Risky calls wait for you\n\nA session works with Kage's tools. A call that acts as you, such as posting somewhere new or clicking in your browser, waits for your yes on a card in your DM. [Approvals](#approvals) covers the card.\n\n## Nothing secret leaves\n\nTokens live in `secrets.json`, and only the hub reads them. Every session runs in a sandbox that cannot open that file. Every outgoing message passes one guard that blocks secrets and crowd pings. [Settings and tokens](#settings-and-tokens) explains the split."},{"id":"slack-threads-and-sessions","title":"Slack threads and sessions","group":"Core","md":"```mermaid\nflowchart LR\n    M[Slack message] --> C{Conversation}\n    C -->|Thread| K[Stable session key]\n    C -->|Top-level DM| D[Shared DM key]\n    K --> S[Claude Code session]\n    D --> S\n    S -->|Idle close or restart| Saved[Saved conversation id]\n    Saved -->|Next task| S\n```\n\n# Slack threads and sessions\n\nA Slack thread is a conversation. Its channel and root message form a stable session key.\n\nTop-level messages in the owner's bot DM share one rolling conversation. Replies inside explicit DM threads stay separate.\n\nEach key maps to one Claude Code conversation. A closed runner can resume that conversation from its saved id.\n\nThe dispatcher limits concurrent sessions. Extra work waits, while a quiet session can release its slot without losing history.\n\nSide lanes provide another session for the same conversation. They keep long work from blocking the main lane.\n\nSee [AGENTS.md](../../AGENTS.md) for commands that inspect, attach to, or stop sessions.\n"},{"id":"who-may-drive-kage","title":"Who may drive Kage","group":"Core","md":"```mermaid\nflowchart TD\n    Input[Incoming message] --> Proof{Sender and proof}\n    Proof -->|Owner typed it| Owner[Owner trust]\n    Proof -->|Listed teammate| Team[Teammate trust]\n    Proof -->|Listed agent| Agent[Teammate trust and loop limits]\n    Proof -->|Authenticated email| Mail[Teammate trust]\n    Proof -->|Unverified voice caller| Voice[Answer only]\n    Proof -->|Kage placed the call| Owner\n    Proof -->|Anything else| Drop[Dropped before a session]\n```\n\n# Who may drive Kage\n\nKage assigns trust from evidence about the sender. A claimed name never raises that trust.\n\nThe owner gets owner trust only for words they typed. Slack proves this with person-typed message fields.\n\nA listed teammate can start work by tagging Kage. Their task still waits for the owner when a protected action needs approval.\n\nA listed agent counts as its listed owner, never as Kage's owner. Loop limits stop two agents from answering forever.\n\nEmail always gets teammate limits, even when it uses the owner's address. Forwarding makes the human sender uncertain.\n\nAn ordinary voice caller can only receive an answer. A call Kage placed can claim owner trust with a one-time code.\n\nMessages without the required tag, listing, or proof drop before Claude reads them.\n\nSee [AGENTS.md](../../AGENTS.md) for the controls that manage teammates and agents.\n"},{"id":"approvals","title":"Approvals","group":"Core","md":"```mermaid\nsequenceDiagram\n    participant Session\n    participant Hub\n    participant DM as Owner's private DM\n    participant Tool\n    Session->>Hub: One tool call and preview\n    Hub->>DM: Approval card\n    DM->>Hub: Yes or no in the card thread\n    Hub->>Session: Allow or deny that call\n    Session->>Tool: Run only after allow\n```\n\n# Approvals\n\nAn approval belongs to one tool call. The card's thread connects the decision to the waiting session, so the owner types no code.\n\nOnly the owner can decide. Kage accepts the answer only inside the card's thread in the owner's bot DM.\n\nThe card shows the tool, context, and a bounded preview. A cut preview tells the owner to inspect the terminal.\n\nAn unclear answer stays on the card. A clear denial is safer than guessing permission.\n\nThe first terminal or Slack decision wins. A stopped session denies every approval that remains open.\n\nKagelets use a separate grant model. Their standing approvals cover named write tools, not arbitrary future calls.\n"},{"id":"kagelets","title":"Kagelets","group":"Work it does","md":"```mermaid\nflowchart TD\n    File[Kagelet file] --> Trigger{Trigger}\n    Trigger -->|Cron schedule| Run[Isolated side-lane run]\n    Trigger -->|After or message| Run\n    Grant[Named tool grant] --> Run\n    Run --> Report[Report and event rows]\n    Report -->|Output| Next[Next kagelet]\n    Report --> Dream[Nightly dream]\n    Dream --> Proposal[Memory proposal]\n    Proposal --> Review{Kage reviews}\n    Review -->|Approve or edit| Notes[Approved notes]\n    Review -->|Reject| End[No memory change]\n```\n\n# Kagelets\n\nA kagelet is a named job with one thread, one trigger, and a fixed tool grant.\n\nA schedule starts a run by time. An `after` link or message starts a run from another kagelet's output.\n\nEvery run uses a side lane. The thread's main session remains separate.\n\nCode assigns each tool to read, write, or act. Kage grants read tools without a card.\n\nThe owner's first approval can stand for one write tool. Act tools never enter a kagelet grant.\n\nChains cannot widen their grants. They also reject missing steps, cycles, and paths deeper than five kagelets.\n\nHandoffs arrive as quoted data. A failed step, unmet need, refused tool, or missing report stops the chain.\n\nA nightly dream reads one kagelet's events, reports, and approved notes. It can only propose a note change.\n\nKage must approve, edit, or reject every proposal. The dream never changes memory by itself.\n\nSee [the settings reference](../settings.md) for limits and cost controls.\n"},{"id":"memory-and-skills","title":"Memory and skills","group":"Work it does","md":"```mermaid\nflowchart TD\n    Threads[Daily thread transcripts] --> Dream[Nightly dream]\n    Dream --> Local[Kage's local memory]\n    Dream --> Check{Lesson applies everywhere?}\n    Check -->|No| Local\n    Check -->|Yes, hub has repository push access| PR[Skill change in a reviewable PR]\n    Skills[Shipped skills] --> Sessions[Every Kage session]\n    Local --> Sessions\n    Owner[Owner memory] -->|Read only checks| Dream\n```\n\n# Memory and skills\n\nKage keeps its own local memory. Claude Code loads that memory into Kage sessions automatically.\n\nThe nightly dream reads recent thread transcripts only while every session is quiet. It saves lasting lessons and tidies duplicates.\n\nKage snapshots its memory before each dream. An undo restores that snapshot and archives the replaced state.\n\nThe owner's memory is a separate source. The dream can inspect it for conflicts, but cannot change it.\n\nShipped skills hold lessons that apply to every owner. The repository plugin loads them into every session.\n\nOnly a hub with repository push access can propose a shared skill change. A person still must merge the proposal.\n\nShared lessons must exclude names, ids, dates, quotes, emails, and personal paths. Local lessons stay local.\n"},{"id":"afk-mode","title":"AFK mode","group":"Surfaces","md":"```mermaid\nflowchart TD\n    Away[Owner says they are away] --> Watch[Watch mentions and direct messages]\n    Watch --> Triage[Classify urgency and keep a note]\n    Triage -->|Normal or low| Quiet[Stay quiet]\n    Triage -->|Second mention or high| Guard[Check the drafted reply]\n    Triage -->|P0| Call[Phone and notify the owner]\n    Guard -->|Safe| Post[Reply as Kage]\n    Guard -->|Held| Private[Send draft to the owner]\n    Back[Owner returns] --> Summary[Restore status and summarize]\n```\n\n# AFK mode\n\nAFK mode is a Slack stand-in for the owner. It watches direct messages and threads that mention them.\n\nThe stand-in stays quiet by default. A second mention or high urgency can produce a guarded reply.\n\nA P0 can phone the owner. Calls are limited across threads, so one burst cannot keep calling.\n\nGuests, bots, shared channels, and customer channels never receive a stand-in reply. Kage still records urgent items for the owner.\n\nThe stand-in uses read-only memory and limited GitHub reads. It cannot promise decisions, prices, deployments, or deadlines.\n\nEvery drafted reply passes a secret check and a second guard. Held drafts go to the owner instead.\n\nWhen the owner returns, Kage restores the earlier status when safe. It then lists items that still need attention first.\n\nSee [the settings reference](../settings.md) for the AFK controls.\n"},{"id":"kage-in-chrome","title":"Kage in Chrome","group":"Surfaces","md":"```mermaid\nsequenceDiagram\n    participant Session as Owner's Kage session\n    participant Hub\n    participant Extension as Chrome extension\n    participant DM as Owner's private DM\n    Session->>Hub: List, read, capture, or inspect controls\n    Hub->>Extension: Local authenticated command\n    Extension-->>Hub: Page data\n    Session->>Hub: One proposed action\n    Hub->>DM: Site, control, and optional picture\n    DM-->>Hub: Yes or no\n    Hub->>Extension: Act only if site and control still match\n```\n\n# Kage in Chrome\n\nKage connects to the owner's browser through a local extension. A shared token authenticates the extension to the hub.\n\nOnly the owner's own tasks can use browser tools. Teammates, agents, callers, and kagelets cannot reach them.\n\nKage can list tabs, read page text, capture the front tab, and inspect controls. Page words always arrive as data.\n\nOnly web pages are readable. The block list also excludes every subdomain of a blocked site.\n\nEach click, typed value, key press, navigation, or new tab needs a private approval card.\n\nThe card names the real site and the control's current page label. A front tab can also provide a picture.\n\nKage checks the site and selected control again after approval. A change to either cancels the action.\n\nSee [AGENTS.md](../../AGENTS.md) for browser setup and [the settings reference](../settings.md) for browser policy.\n"},{"id":"email","title":"Email","group":"Surfaces","md":"```mermaid\nflowchart LR\n    Mail[Incoming mail] --> Checks{Spam, virus, DMARC, DKIM, sender, tag}\n    Checks -->|Fail| Drop[Drop]\n    Checks -->|Pass| Key[Mail thread session key]\n    Key --> Session[Kage session with teammate limits]\n    Session --> Reply[Reply all within the owner's domain]\n```\n\n# Email\n\nEmail is another conversation surface. The first message reference becomes the stable key for its Kage session.\n\nKage accepts mail only from the owner address or a listed teammate address. The new text must tag Kage.\n\nTransport checks must pass. Kage also requires the sender's mail-provider DKIM signature, because DMARC alone can accept another aligned signer.\n\nEvery email task gets teammate limits. Even mail from the owner address cannot approve tools or claim owner trust.\n\nEarlier mail stays quoted as data. Only the new part becomes the task.\n\nReplies keep the mail thread. Reply-all targets stay inside the owner's email domain.\n\nSee [the settings reference](../settings.md) for the email controls.\n"},{"id":"whatsapp","title":"WhatsApp","group":"Surfaces","md":"```mermaid\nflowchart TD\n    Event[Signed WhatsApp event] --> Who{Who sent it?}\n    Who -->|Owner tags Kage| Task[Owner task and armed chat]\n    Who -->|Other person in armed chat| StandIn[Restricted stand-in]\n    Who -->|Anything else| Ignore[Store and ignore]\n    Task --> Guard[Outbound guard]\n    StandIn --> Guard\n    Guard -->|Safe| Send[Send from owner's account]\n    Guard -->|Held| DM[Hold and notify owner in Slack]\n    OwnerTypes[Owner types again] --> Disarm[Disarm chat]\n```\n\n# WhatsApp\n\nWhatsApp uses a signed webhook from WAHA, an unofficial bridge linked to the owner's account.\n\nOnly a fresh message the owner typed can start a Kage task. The message must contain Kage's tag.\n\nThat tag also arms the chat for one hour. A separate stand-in can answer later messages from that chat.\n\nThe stand-in reads only its dedicated notes and recent chat history. It has no MCP servers or project settings.\n\nThe owner's next untagged message disarms the chat. A reply limit also stops loops with automated accounts.\n\nEvery outgoing message passes a secret check and a guard. Unsafe text is held and sent to the owner's Slack DM.\n\nWAHA is not an official WhatsApp client. Using it can put the linked account at risk.\n\nSee [the settings reference](../settings.md) for WhatsApp controls and the current risk note.\n"},{"id":"voice-and-calls","title":"Voice and calls","group":"Surfaces","md":"```mermaid\nflowchart TD\n    Caller[Voice agent] --> MCP[Authenticated ask_kage call]\n    MCP --> Code{Valid one-time owner code?}\n    Code -->|No| Limited[Caller session: reply only]\n    Code -->|Yes| Owner[Owner session: normal tools and approvals]\n    Limited --> Spoken[Short spoken reply]\n    Owner --> Spoken\n    AFK[AFK P0 or local call command] --> Dialer[External dialer gets one-time code]\n    Dialer --> MCP\n```\n\n# Voice and calls\n\nThe voice connector gives a phone agent one tool named `ask_kage`. One MCP session represents one call.\n\nKage treats an ordinary caller as unverified. Caller ID cannot prove identity, so the session can only reply.\n\nThe restricted caller gets no shell, files, web, private sources, posts, schedules, or approval prompts.\n\nKage can place a call to the owner through an external dialer. The dialer receives a short-lived, one-time code.\n\nThe first call that claims that code gets owner trust until the call ends. It keeps normal tools and approval rules.\n\nEach call keeps one conversation, so later questions retain context. Idle calls release their session and slot.\n\nCall and hourly limits protect the owner's other sessions. A new call never evicts or jumps ahead of existing work.\n\nSee [the settings reference](../settings.md) for voice, call, and capacity controls.\n"},{"id":"settings-and-tokens","title":"Settings and tokens","group":"Running it","md":"```mermaid\nflowchart TD\n    Old[Old env file] -->|First start, once| Import[Import]\n    Import --> Config[config.json: typed settings]\n    Import --> Secrets[secrets.json: tokens, mode 600]\n    Import --> Kept[env.imported-time, deleted after 7 days]\n    Config --> Watch[Validate and watch]\n    Watch -->|Valid live key| Apply[Apply now]\n    Watch -->|Valid restart key| Restart[Restart when sessions are quiet]\n    Watch -->|Invalid| Keep[Keep last good config and DM the owner]\n    Secrets --> Hub[Read by the hub only]\n```\n\n# Settings and tokens\n\nKage keeps settings and tokens in two files. Settings live in `config.json`. Tokens live in `secrets.json`, which is private to the owner's account.\n\nAn install from before this split had one `env` file. On its first start, the hub imports that file by itself. The old file stays as `env.imported-\u003ctime>` for 7 days.\n\nThe hub watches `config.json`. A change to `people` applies at once. Any other valid change restarts Kage once every session is quiet. An invalid file is refused, and Kage keeps the last good settings.\n\nSessions change settings through `kage set` or the `set_setting` tool. A key that widens what Kage may do needs the owner's approval card first.\n\nNo session can read `secrets.json`, the owner's own sessions included. Tokens stay in the hub's memory and never enter a session's environment. A session that needs Kage to post somewhere asks the hub to do it.\n\n[The settings reference](../settings.md) lists every key and its default.\n"},{"id":"updates-and-releases","title":"Updates and releases","group":"Running it","md":"```mermaid\nflowchart LR\n    Main[Changes merge to main] --> Soak[Owner hub runs the code for 24 hours]\n    Soak --> Gate{Doctor good and no crash-loop alert?}\n    Gate -->|No| Wait[No release]\n    Gate -->|Yes| Tag[Version commit and tag]\n    Tag --> Stable[Move stable tag]\n    Stable --> Notes[Publish GitHub release notes]\n    Stable --> Fetch[Installed hubs check every six hours]\n    Fetch --> Safe{Clean main checkout and fast-forward only?}\n    Safe -->|Yes| Quiet[Wait for quiet sessions]\n    Quiet --> Restart[Restart into new code]\n    Safe -->|No| Skip[Leave checkout unchanged]\n```\n\n# Updates and releases\n\nA merge to `main` does not update installed hubs. Installations follow the separate `stable` tag.\n\nThe repository admin's hub can release code that ran on it for 24 hours. A merge that changes only docs, tests, skill text or the license keeps the clock running. A code change starts it again.\n\nThe hub releases the newest commit that finished its 24 hours, even if newer code has landed since. It logs the next candidate and when its gate opens every hour. The owner can also run `kage release` to release at once.\n\nThe gate also requires a healthy doctor result and no crash loop during the run. A crash loop starts the 24 hours again. A failed gate creates no release.\n\nA release bumps the version files and creates a version tag. It then moves `stable` and publishes the notes.\n\nInstalled hubs check `stable` every six hours. Only a clean checkout on `main` can move forward.\n\nUpdates use a fast-forward merge. A checkout with local commits or changes stays untouched.\n\nAfter pulling, the hub waits until every session is quiet. It then restarts and tells the owner what changed.\n\nRelease tags are not signed yet. Issue #58 tracks that remaining trust gap.\n\nSee [AGENTS.md](../../AGENTS.md) for the supported update commands.\n"}]};
const P=D.pages, $=s=>document.querySelector(s);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const plain=md=>md.replace(/```[\s\S]*?```/g,'').replace(/^#.*$/gm,'').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').replace(/[`*]/g,'').replace(/\s+/g,' ').trim();
const num=i=>String(i).padStart(2,'0');
function dark(){const t=document.documentElement.dataset.theme;return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches}
function initMermaid(){const d=dark();mermaid.initialize({startOnLoad:false,theme:'base',securityLevel:'strict',fontFamily:'JetBrains Mono, monospace',
 flowchart:{useMaxWidth:false,nodeSpacing:36,rankSpacing:44,curve:'basis'},
 themeVariables:{fontSize:'13px',background:'transparent',primaryColor:d?'#1f1d1a':'#f7f5f0',primaryTextColor:d?'#efe9df':'#16140f',primaryBorderColor:d?'#4a453e':'#b9b2a6',lineColor:d?'#8a847a':'#8a847a',
 clusterBkg:'transparent',edgeLabelBackground:d?'#1b1916':'#e9e5dd',actorBkg:d?'#1f1d1a':'#f7f5f0',actorBorder:d?'#4a453e':'#b9b2a6',actorTextColor:d?'#efe9df':'#16140f',signalColor:'#8a847a',signalTextColor:d?'#efe9df':'#16140f',labelBoxBkgColor:d?'#1f1d1a':'#f7f5f0',noteBkgColor:d?'#1f1d1a':'#f7f5f0'},
 themeCSS:'.door>rect,.door>polygon{stroke:'+(d?'#efe9df':'#16140f')+'!important;stroke-width:1.5px!important} .you>rect{stroke:#ff4f00!important;stroke-width:1.5px!important} .key>rect{stroke-dasharray:4 3!important;opacity:.8} .node rect{rx:0;ry:0}'})}
// sidebar
let g='';$('#side').innerHTML=P.map((p,i)=>{let h='';if(p.group!==g){g=p.group;h='<div class="grp">'+g+'</div>'}return h+'<a href="#'+p.id+'" data-id="'+p.id+'"><span class="n">'+num(i)+'</span><span>'+p.title+'</span></a>'}).join('');
let n=0,cur=0;
async function draw(){for(const el of document.querySelectorAll('pre.m')){const {svg}=await mermaid.render('m'+(n++),el.textContent);const f=document.createElement('figure');f.innerHTML='<div class="d">'+svg+'</div><figcaption><span>FIG. '+num(cur)+'</span><span>CLICK TO ENLARGE</span></figcaption>';f.querySelector('.d').onclick=()=>{$('#zoom').innerHTML=svg;$('#zoom').classList.add('open')};el.replaceWith(f)}}
function show(id){
 const i=Math.max(0,P.findIndex(p=>p.id===id));cur=i;const p=P[i];
 document.querySelectorAll('#side a').forEach(a=>a.classList.toggle('on',a.dataset.id===p.id));
 let md=p.md, fig='';
 md=md.replace(/^```mermaid\n([\s\S]*?)```\s*/,(_,c)=>{fig=c;return ''});
 const body=md.replace(/^# .+\n+/,'');
 const first=(body.match(/^[^#\n].+$/m)||[''])[0];
 const rest=body.replace(first,'');
 const words=plain(p.md).split(' ').length;
 const html=marked.parse(rest.replace(/\]\(([a-z-]+)\.md\)/g,'](#$1)').replace(/\]\(\.\.\/settings\.md\)/g,'](https://github.com/aloki-alok/kage/blob/main/docs/settings.md)').replace(/\]\(\.\.\/\.\.\/AGENTS\.md\)/g,'](https://github.com/aloki-alok/kage/blob/main/AGENTS.md)'));
 $('#main').innerHTML='<div class="col fade"><div class="eyebrow">'+num(i)+' / '+(p.group||'').toUpperCase()+'</div><h1>'+esc(p.title)+'</h1><p class="stand">'+marked.parseInline(first)+'</p>'+
  '<dl class="meta"><div><dt>MODE</dt><dd>Explanation</dd></div><div><dt>READ</dt><dd>'+Math.max(1,Math.round(words/220))+' min</dd></div><div><dt>SOURCE</dt><dd><code>docs/concepts/'+(i?p.id+'.md':'README.md')+'</code></dd></div></dl>'+
  (fig?'<pre class="m">'+esc(fig)+'</pre>':'')+'<div class="prose">'+html+'</div>'+
  '<div class="pager">'+(i>0?'<a class="prev" href="#'+P[i-1].id+'"><div class="k">PREVIOUS</div><div class="t">'+P[i-1].title+'</div></a>':'')+(i<P.length-1?'<a class="next" href="#'+P[i+1].id+'"><div class="k">NEXT</div><div class="t">'+P[i+1].title+'</div></a>':'')+'</div></div>';
 // anchors and outline
 const hs=[...document.querySelectorAll('.prose h2')];hs.forEach(h=>{h.id=h.textContent.toLowerCase().replace(/[^a-z0-9]+/g,'-');h.insertAdjacentHTML('beforeend','<a class="anchor" href="#'+p.id+'/'+h.id+'">#</a>')});
 $('#toc').innerHTML='<div class="h">ON THIS PAGE</div>'+(hs.length?hs.map(h=>'<a href="#'+p.id+'/'+h.id+'" data-h="'+h.id+'">'+esc(h.childNodes[0].textContent)+'</a>').join(''):'<a class="on">'+esc(p.title)+'</a>')+'<div class="prog"><i id="pbar"></i><span id="ptxt">0%</span></div>';
 $('#kprev').href='#'+P[Math.max(0,i-1)].id;$('#knext').href='#'+P[Math.min(P.length-1,i+1)].id;
 initMermaid();draw();onScroll();
}
function route(){const [id,h]=location.hash.slice(1).split('/');if(id!==P[cur]?.id||!$('#main').innerHTML){show(id);scrollTo(0,0)}if(h){const el=document.getElementById(h);el&&el.scrollIntoView()}}
function onScroll(){const m=$('#main'),r=m.getBoundingClientRect(),t=Math.min(1,Math.max(0,(-r.top+60)/(r.height-innerHeight+60)));const b=$('#pbar');if(b){b.style.setProperty('--p',(t*100)+'%');$('#ptxt').textContent=Math.round(t*100)+'%'}
 let on=null;document.querySelectorAll('.prose h2').forEach(h=>{if(h.getBoundingClientRect().top<140)on=h.id});document.querySelectorAll('#toc a[data-h]').forEach(a=>a.classList.toggle('on',a.dataset.h===on))}
addEventListener('scroll',onScroll,{passive:true});addEventListener('hashchange',route);
// theme
$('#theme').onclick=()=>{const r=document.documentElement;r.dataset.theme=dark()?'light':'dark';try{localStorage.setItem('kage-docs-theme',r.dataset.theme)}catch(e){}show(location.hash.slice(1).split('/')[0]||P[0].id)};
try{const t=localStorage.getItem('kage-docs-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
// search
const idx=P.map((p,i)=>({i,p,text:plain(p.md)}));let sel=0;
function search(q){q=q.trim().toLowerCase();const r=q?idx.filter(x=>(x.p.title+' '+x.text).toLowerCase().includes(q)).slice(0,8):idx.slice(0,8);sel=0;
 $('#res').innerHTML=r.length?r.map((x,k)=>{const at=x.text.toLowerCase().indexOf(q);const sn=q&&at>=0?esc(x.text.slice(Math.max(0,at-50),at))+'<mark>'+esc(x.text.slice(at,at+q.length))+'</mark>'+esc(x.text.slice(at+q.length,at+q.length+70)):esc(x.text.slice(0,110));return '<a href="#'+x.p.id+'" class="'+(k?'':'sel')+'"><div class="rt"><span class="mono" style="color:var(--mid);font-size:12px;margin-right:10px">'+num(x.i)+'</span>'+x.p.title+'</div><div class="rs">'+sn+'</div></a>'}).join(''):'<div class="empty">No page mentions that.</div>'}
function openS(){$('#scrim').classList.add('open');$('#q').value='';search('');$('#q').focus()}
function closeS(){$('#scrim').classList.remove('open')}
$('#sbtn').onclick=openS;$('#scrim').onclick=e=>{if(e.target.id==='scrim')closeS()};$('#res').onclick=closeS;
$('#q').oninput=e=>search(e.target.value);
$('#q').onkeydown=e=>{const a=[...document.querySelectorAll('#res a')];if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();a[sel]?.classList.remove('sel');sel=(sel+(e.key==='ArrowDown'?1:a.length-1))%a.length;a[sel]?.classList.add('sel');a[sel]?.scrollIntoView({block:'nearest'})}if(e.key==='Enter'&&a[sel]){location.hash=a[sel].getAttribute('href');closeS()}if(e.key==='Escape')closeS()};
$('#zoom').onclick=()=>$('#zoom').classList.remove('open');
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.metaKey||e.ctrlKey)return;const k=e.key.toLowerCase();
 if(k==='/'){e.preventDefault();openS()}else if(k==='j')location.hash=P[Math.max(0,cur-1)].id;else if(k==='k')location.hash=P[Math.min(P.length-1,cur+1)].id;
 else if(k==='h')location.hash=P[0].id;else if(k==='t')$('#theme').click();else if(k==='escape'){$('#zoom').classList.remove('open');closeS()}});
show(location.hash.slice(1).split('/')[0]||P[0].id);
</script></body></html>
