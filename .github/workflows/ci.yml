name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  meetbot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meetbot
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm test
